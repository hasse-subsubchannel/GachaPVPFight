</style></head><body><div id="bar"></div><div id="app"></div><div id="m"></div><div id="t"></div><script>
const $=s=>document.querySelector(s),LS=localStorage,SS=sessionStorage;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),td=()=>new Date().toISOString().slice(0,10);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};

const G=v=>v===''||v==null||isNaN(v)?E(v||'未設定'):v+'G';
const isOP=()=>/[?&]edit/.test(location.search)&&SS.fok==='1';
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let D;
const SAMPLE='ノーマルアイテム,Common,70\nレアアイテム,Rare,25\nレジェンドアイテム,Legend,5';
function seed(){const g=[['完全ランダムガチャ',2,'全レアリティからランダム'],['レア以上確定ガチャ','','Rare・Legend確定'],['防具ガチャ',4,'ヘルメット・胴・脚・ブーツ'],['武器ガチャ',4,'剣・斧・槍など'],['弓ガチャ',5,'レアリティ別の矢'],['食料ガチャ',2,'レアリティ別の食料'],['サブアイテムガチャ',3,'補助アイテム']].map(([name,price,desc],i)=>({id:'g'+i,name,price,desc,img:'',items:SAMPLE,note:'排出確率の合計は100%です。',order:i+1,pub:'公開'}));
return{site:{name:'ガチャPVP Fight',tag:'引け、戦え、頂点へ。',pw:''},seasons:[{id:'s1',name:'シーズン1',start:td(),end:addD(td(),30),initGold:100,desc:'第1シーズン',status:'進行中',granted:true}],players:[],matches:[],events:[],gachas:g,
rules:[{id:'r1',order:1,h:'基本ルール',body:'- リアルタイム戦闘\n- 装備は毎試合ガチャで獲得\n- 試合ごとにルールが変わる場合は個別試合ルールを優先'},{id:'r2',order:2,h:'報酬',body:'- 試合参加費は1人10G\n- 1位の勝利報酬は20G\n- 敗北時の追加報酬は0G'},{id:'r3',order:3,h:'シーズンとゴールド',body:'- シーズン中のゴールドは持ち越し\n- シーズン終了時にゴールドをリセット\n- シーズンが始まるとゴールド追加'}],
news:[{id:'n1',title:'公式サイトOPEN',cat:'重要',imp:'重要',date:td()+'T12:00',pub:'公開',body:'ガチャPVP Fight 公式サイトを公開しました。'}],logs:[]}}
async function load(){D=null;if(!SS.fok&&LS.fokt&&Date.now()-LS.fokt<288e5)SS.fok='1';
if(/[?&]edit/.test(location.search)&&!(LS.dirty==='1'&&LS.fdata))try{const c=JSON.parse(LS.fc||'{}');if(c.repo&&c.token){const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/data.json?ref=${c.branch||'main'}`,{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github.raw+json'}});if(r.ok)D=await r.json()}}catch(e){}
if(LS.dirty==='1'&&LS.fdata)D=JSON.parse(LS.fdata);if(!D)try{const r=await fetch('data.json?t='+Date.now());if(r.ok)D=await r.json()}catch(e){}D=D||seed()}
async function save(msg){LS.fdata=JSON.stringify(D);LS.dirty='1';const c=JSON.parse(LS.fc||'{}');if(!c.repo||!c.token)throw Error('GitHubのリポジトリ/トークンが未設定です（サイト設定）。内容はこのブラウザに一時保存されています。');
const u=`https://api.github.com/repos/${c.repo}/contents/data.json`,H={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},br=c.branch||'main';let s,r=await fetch(u+'?ref='+br,{headers:H});
if(r.ok)s=(await r.json()).sha;else if(r.status!=404)throw Error('GitHub読込失敗('+r.status+')。リポジトリ名・トークンを確認してください');
r=await fetch(u,{method:'PUT',headers:H,body:JSON.stringify({message:msg||'update',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1)))),sha:s,branch:br})});
if(!r.ok)throw Error('GitHub保存失敗('+r.status+')。トークンにContents:Read/Write権限があるか確認してください');LS.dirty='0'}
function toast(m,e){const t=$('#t');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',e?6000:2500)}
async function act(fn,msg){try{fn();await save(msg);toast('保存しました（GitHubに反映）')}catch(e){toast(e.message,1)}render()}
function modal(h){const m=$('#m');m.innerHTML='<div>'+h+'</div>';m.style.display='block'}const closeM=()=>$('#m').style.display='none';
function prog(){const b=$('#bar');b.style.transition='none';b.style.opacity=1;b.style.transform='scaleX(0)';b.offsetWidth;b.style.transition='transform .5s ease-out';b.style.transform='scaleX(1)';setTimeout(()=>{b.style.transition='opacity .3s';b.style.opacity=0},550)}
const cur=()=>D.seasons.find(s=>s.status==='進行中'),left=s=>s?Math.max(0,Math.ceil((new Date(s.end+'T23:59:59')-Date.now())/864e5)):0,rate=p=>p.m?Math.round(p.w/p.m*100):0;
const rank=()=>[...D.players].sort((x,y)=>y.w-x.w||rate(y)-rate(x)||x.l-y.l).map((p,i)=>({...p,r:i+1}));
const ico=p=>p.icon||`https://mc-heads.net/avatar/${encodeURIComponent(p.name)}/48`;
const log=(t,p,d,note)=>D.logs.unshift({t:new Date().toISOString().slice(0,16).replace('T',' '),type:t,player:p.name,d,note,bal:t==='bank'?p.bank:p.gold});
const TC={'PVP試合':'#e5484d','チーム戦':'#d6336c','トーナメント':'#c2410c','シーズン':'#d4a73a','ゴールド配布':'#b8860b','イベント':'#2f6fed','メンテナンス':'#8a94a6','その他':'#1f8a5b'};
const NAV=[['home','ホーム'],['matches','試合情報'],['calendar','スケジュール'],['season','シーズン'],['rules','ルール'],['ranking','ランキング'],['bank','銀行'],['gacha','ガチャ一覧'],['news','お知らせ']];
const NC=['重要','試合情報','シーズン情報','イベント','メンテナンス','その他'];
/* ---------- schema for admin CRUD ---------- */
const S={
matches:{t:'試合',c:['name','fmt','date','status'],d:{fmt:'個人戦',fee:10,prize:20,status:'受付前',cap:2,teamSize:2},f:[['name','試合名'],['fmt','試合形式','sel',['個人戦','チーム戦','トーナメント']],['date','開催日時','dt'],['open','受付開始','dt'],['close','受付終了','dt'],['venue','会場名（自由入力）'],['vdesc','会場の説明','area'],['vimg','会場画像URL'],['fee','参加費(G)','num'],['prize','優勝賞金(G)','num'],['reward','その他の報酬'],['limit','制限時間'],['cap','参加人数','num'],['teamSize','チーム人数','num'],['players','参加者（1行1名／チーム戦は「チーム名:A,B」）','area'],['bracket','対戦カード（トーナメント：1行「A|B|勝者」）','area'],['rules','個別試合ルール','area'],['desc','試合の説明','area'],['status','状態','sel',['受付前','受付中','開催中','終了','中止']],['winners','【結果】勝者（カンマ区切り・登録名）'],['losers','【結果】敗者（カンマ区切り）'],['champ','優勝者・準優勝者など'],['gold','【結果】勝者の獲得G','num'],['result','結果メモ','area']]},
events:{t:'予定',c:['title','type','date'],d:{type:'イベント'},f:[['title','タイトル'],['type','種類','sel',Object.keys(TC)],['date','日付','date'],['start','開始時間','time'],['end','終了時間','time'],['desc','詳細説明','area']]},
players:{t:'プレイヤー',c:['name','gold','bank','w','l','m'],f:[['name','Minecraftプレイヤー名'],['uuid','UUID（任意）'],['icon','アイコンURL（空欄で自動）'],['joined','登録日','date']]},
seasons:{t:'シーズン',c:['name','start','end','status'],d:{initGold:100,status:'準備中'},f:[['name','シーズン名'],['start','開始日','date'],['end','終了日','date'],['initGold','初期配布G','num'],['desc','説明','area'],['status','状態','sel',['準備中','進行中','終了']]]},
gachas:{t:'ガチャ',c:['name','price','pub','order'],d:{pub:'公開',order:99},f:[['name','ガチャ名'],['price','価格（数字 or 未設定）'],['desc','説明','area'],['img','画像URL'],['items','排出アイテム（1行「名前,Common|Rare|Legend,確率%」）','area'],['note','注意事項','area'],['order','表示順','num'],['pub','公開設定','sel',['公開','非公開']]]},
rules:{t:'ルール',c:['h','order'],d:{order:99},f:[['h','見出し'],['body','本文（「- 」で始まる行は箇条書き）','area'],['order','表示順','num']]},
news:{t:'お知らせ',c:['title','cat','imp','pub'],d:{cat:'その他',imp:'通常',pub:'公開'},f:[['title','タイトル'],['cat','カテゴリー','sel',NC],['imp','重要度','sel',['通常','重要']],['date','投稿日時','dt'],['pub','公開設定','sel',['公開','非公開']],['body','本文','area']]}};
const hooks={players(o,isNew){if(isNew){const s=cur();Object.assign(o,{gold:s?+s.initGold:0,bank:0,w:0,l:0,m:0,joined:o.joined||td()})}
if(D.players.some(p=>p.id!==o.id&&p.name.toLowerCase()===o.name.toLowerCase()))throw Error('同名のプレイヤーが既に登録されています')},
matches(o){if(o.status==='終了'&&!o.applied){const f=k=>String(o[k]||'').split(',').map(x=>x.trim()).filter(Boolean),P=n=>D.players.find(p=>p.name.toLowerCase()===n.toLowerCase());
f('winners').forEach(n=>{const p=P(n);if(p){p.w++;p.m++;if(+o.gold){p.gold+=+o.gold;log('gold',p,+o.gold,'試合報酬: '+o.name)}}});f('losers').forEach(n=>{const p=P(n);if(p){p.l++;p.m++}});o.applied=1;if(!o.rdate)o.rdate=o.date}},
gachas(o){if(!o.name)throw Error('ガチャ名は必須です')}};
/* ---------- generic admin actions ---------- */
function dflt(k){const o={...(S[k].d||{})};if(k==='seasons'){o.start=td();o.end=addD(td(),30)}if(k==='news')o.date=new Date().toISOString().slice(0,16);return o}
const fld=(n,t,op,v)=>t==='area'?`<textarea name="${n}" rows="4">${E(v)}</textarea>`:t==='sel'?`<select name="${n}">${op.map(x=>`<option ${x==v?'selected':''}>${E(x)}</option>`).join('')}</select>`:`<input name="${n}" type="${{num:'number',dt:'datetime-local',date:'date',time:'time'}[t]||'text'}" step="any" value="${E(v)}">`;
function edit(k,id){const s=S[k],o=id?D[k].find(x=>x.id==id):dflt(k);modal(`<h3>${id?'編集':'追加'}：${s.t}</h3><form onsubmit="return sv(event,'${k}','${id||''}')">${s.f.map(([n,l,t,op])=>`<label>${l}${fld(n,t,op,o[n])}</label>`).join('')}<div class="ac"><button type="button" class="b g" onclick="closeM()">キャンセル</button><button class="b">保存</button></div></form>`)}
function sv(e,k,id){e.preventDefault();const fd=new FormData(e.target),s=S[k];closeM();act(()=>{const o=id?D[k].find(x=>x.id==id):{id:uid()};const old={...o};s.f.forEach(([n,,t])=>{let v=fd.get(n);o[n]=t==='num'?(v===''?'':+v):v});
try{(hooks[k]||(()=>{}))(o,!id)}catch(x){Object.assign(o,old);throw x}if(!id)D[k].push(o)},'edit '+k);return false}
function del(k,id){if(confirm('本当に削除しますか？この操作は元に戻せません。'))act(()=>{D[k]=D[k].filter(x=>x.id!=id)},'delete '+k)}
function crud(k,extra){const s=S[k],rows=k==='gachas'||k==='rules'?[...D[k]].sort((a,b)=>a.order-b.order):D[k];
return`<div class="ah"><h2>${s.t}管理</h2><button class="b" onclick="edit('${k}')">＋ 追加</button></div><div class="tw"><table><tr>${s.c.map(c=>`<th>${s.f.find(f=>f[0]===c)?.[1].split('（')[0]||{gold:'所持G',bank:'銀行',w:'勝',l:'敗',m:'試合'}[c]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${s.c.map(c=>`<td>${E(r[c])}</td>`).join('')}<td style="white-space:nowrap">${extra?extra(r):''}<button class="b s g" onclick="edit('${k}','${r.id}')">編集</button> <button class="b s r" onclick="del('${k}','${r.id}')">削除</button></td></tr>`).join('')||'<tr><td>データなし</td></tr>'}</table></div>`}
/* ---------- money ---------- */
function goldAdj(id,d,note){const p=D.players.find(x=>x.id===id);if(!p)return toast('プレイヤーを選択してください',1);if(!d)return toast('金額を入力してください',1);if(p.gold+d<0)return toast('所持ゴールドが足りません',1);act(()=>{p.gold+=d;log('gold',p,d,note||'OP手動調整')},'gold')}
function bankOp(id,type,amt){const p=D.players.find(x=>x.id===id);amt=Math.floor(+amt);if(!p)return toast('プレイヤー名が見つかりません',1);if(!(amt>0))return toast('1以上の整数を入力してください',1);

case'ranking':return`<h2>ランキング管理</h2><p>勝敗は試合結果の登録（試合管理→状態「終了」）で自動集計されます。</p><button class="b" onclick="updPrev()">現在の順位を「前回順位」として確定</button>${pRanking()}`;
case'settings':{const c=JSON.parse(LS.fc||'{}');return`<h2>サイト設定</h2><div class="c"><label>サイト名<input id="sn" value="${E(D.site.name)}"></label><label>キャッチコピー<input id="st" value="${E(D.site.tag)}"></label><label>OPパスワード変更（空欄で変更なし）<input id="sp" type="password"></label><p><button class="b" onclick="setSave()">保存</button></p></div>
<h2>カラー設定</h2><div class="c"><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${[['nv','メイン（ネイビー）'],['gd','アクセント（ゴールド）'],['gr','サブ（グリーン）'],['bg','背景']].map(([k,l])=>`<label>${l}<input type="color" id="th_${k}" value="${thv(k)}" oninput="thm()" style="height:42px;padding:2px"></label>`).join('')}</div><p>プリセット：${PRE.map((p,i)=>`<button class="b s g" onclick="preset(${i})">${p[0]}</button>`).join(' ')}</p><p class="mu">色はすぐ画面に反映されます。上の「保存」を押すと全員のサイトに反映されます。</p></div><h2>GitHub連携</h2><div class="c"><label>リポジトリ（owner/repo）<input id="gr" value="${E(c.repo)}"></label><label>ブランチ<input id="gb" value="${E(c.branch||'main')}"></label><label>アクセストークン（このブラウザのみ保存）<input id="gt" type="password" value="${E(c.token)}"></label><p><button class="b" onclick="ghSave()">接続情報を保存</button> <button class="b g" onclick="exportJ()">JSONを書き出し</button></p></div>`}}}
async function setSave(){const pw=$('#sp').value;const h=pw?await sha(pw):null;act(()=>{D.site.name=$('#sn').value;D.site.tag=$('#st').value;if(h)D.site.pw=h},'settings')}
function ghSave(){LS.fc=JSON.stringify({repo:$('#gr').value.trim(),branch:$('#gb').value.trim(),token:$('#gt').value.trim()});act(()=>{},'sync')}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='data.json';a.click()}
async function login(e){e.preventDefault();const f=new FormData(e.target),h=await sha(f.get('pw'));if(!f.get('pw'))return toast('パスワードを入力してください',1);
if(D.site.pw&&D.site.pw!==h)return toast('パスワードが違います',1);if(!D.site.pw){D.site.pw=h;LS.dirty='1';LS.fdata=JSON.stringify(D)}
const oc=JSON.parse(LS.fc||'{}');LS.fc=JSON.stringify({repo:f.get('repo').trim(),branch:f.get('br').trim()||'main',token:f.get('tk').trim()||oc.token||''});SS.fok='1';LS.fokt=Date.now();await load();render();return false}
function admin(s){if(!isOP())return`<div class="wrap" style="max-width:420px"><h2>OPログイン</h2><form class="c" onsubmit="return login(event)"><p class="mu">${D.site.pw?'':'初回：入力したパスワードがOPパスワードになります。'}</p><label>パスワード<input name="pw" type="password"></label><label>GitHubリポジトリ（owner/repo）<input name="repo" value="${E(JSON.parse(LS.fc||'{}').repo)}"></label><label>ブランチ<input name="br" value="main"></label><label>GitHubトークン<input name="tk" type="password" placeholder="空欄なら保存済みのトークンを使用"></label><p><button class="b">ログイン</button> <a class="b g" href="${location.pathname}">サイトへ戻る</a></p></form></div>`;
return`<div class="ad"><div class="sb"><b>OP管理画面</b>${AN.map(([k,l])=>`<a href="?edit#/${k}" class="${k===s?'on':''}">${l}</a>`).join('')}<a href="${location.pathname}">← サイトを見る</a><a href="#" onclick="SS.fok='';LS.fokt='';render();return false">ログアウト</a></div><div class="mn">${aBody(s)}</div></div>`}
function foot(){const s=cur(),nm=nextMatch(),n=pubNews().slice(0,3),r=rank().slice(0,3);
return`<footer class="ft"><div class="wrap fg"><div><div class="logo" style="margin-bottom:8px">${E(D.site.name)}</div><p>${E(D.site.tag)}</p><p class="mu2">${s?E(s.name)+'　残り'+left(s)+'日':'現在シーズン外'}<br>次の試合：${nm?E(nm.name)+'（'+fdt(nm.date)+'）':'予定なし'}</p></div><div><h4>MENU</h4>${NAV.map(([k,l])=>`<a href="#/${k}">${l}</a>`).join('')}</div><div><h4>NEWS</h4>${n.map(x=>`<a href="#/news">${E(x.title)}</a>`).join('')||'<span class="mu2">なし</span>'}</div><div><h4>RANKING</h4>${r.map(x=>`<a href="#/player/${x.id}">${x.r}位　${E(x.name)}</a>`).join('')||'<span class="mu2">なし</span>'}</div></div><div class="cp">© ${E(D.site.name)}</div></footer>`}
const TH={nv:'#0b1a33',gd:'#d4a73a',gr:'#1f8a5b',bg:'#f3f6f4'},PRE=[['ゴールド×ネイビー','#0b1a33','#d4a73a','#1f8a5b','#f3f6f4'],['エメラルド','#06281f','#e0b84a','#12a36b','#f1f7f4'],['クリムゾン','#1a0a12','#e5484d','#b8860b','#f8f4f4'],['パープル','#1a0f33','#c4a3ff','#2f6fed','#f4f3fa'],['モノクロ','#111418','#e6e6e6','#667085','#f5f5f5']];
const thv=k=>(D.site.theme||{})[k]||TH[k];
function applyTheme(){Object.keys(TH).forEach(k=>document.documentElement.style.setProperty('--'+k,thv(k)))}
function thm(){D.site.theme=Object.fromEntries(Object.keys(TH).map(k=>[k,$('#th_'+k).value]));applyTheme()}
function preset(i){const p=PRE[i];['nv','gd','gr','bg'].forEach((k,j)=>$('#th_'+k).value=p[j+1]);thm()}
function render(){applyTheme();const[p,a]=(location.hash.slice(2)||'home').split('/');if(/[?&]edit/.test(location.search)){$('#app').innerHTML=admin(p==='home'?'dash':p);return}
const pages={home:pHome,matches:pMatches,calendar:pCal,season:pSeason,rules:pRules,ranking:pRanking,player:pPlayer,bank:pBank,gacha:pGacha,news:pNews};
$('#app').innerHTML=`<header><a class="logo" href="#/home">${E(D.site.name)}</a><nav>${NAV.map(([k,l])=>`<a href="#/${k}" class="${k===p?'on':''}">${l}</a>`).join('')}</nav></header>${(pages[p]||pHome)(a)}${foot()}`}
addEventListener('hashchange',()=>{prog();render();scrollTo(0,0)});
load().then(()=>{prog();render()});
</script></body></html>
